<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyRead — Stories Worth Reading</title>
<meta name="description" content="Discover useful articles, ideas and stories on DailyRead.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#18251f;--green:#216b4b;--paper:#f8f8f3;--muted:#70786f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
header{padding:20px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e8df}
.logo{font-size:25px;font-weight:800;color:var(--green)}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px;background:var(--green);color:white;font-weight:bold}
button.secondary{background:#e7eee8;color:var(--green)}
main{max-width:1100px;margin:auto;padding:35px 20px}
.hero{padding:35px 0 25px}
.hero small{color:var(--green);font-weight:bold;letter-spacing:2px}
h1{font-size:clamp(36px,7vw,62px);margin:14px 0;letter-spacing:-2px}
.hero p{color:var(--muted);font-size:18px;line-height:1.7;max-width:650px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}
input,textarea,select{width:100%;padding:12px;border:1px solid #d8ded6;border-radius:8px;font:inherit;background:white}
.tools input{max-width:420px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.article{background:white;border:1px solid #e7e9e2;border-radius:13px;padding:22px}
.tag{font-size:12px;color:var(--green);font-weight:bold;text-transform:uppercase}
.article h2{line-height:1.35}
.article p{color:var(--muted);line-height:1.65}
.article button{margin-top:8px}
#reader{display:none;background:white;border-radius:14px;padding:25px;margin:25px 0;line-height:1.8}
#reader h2{font-size:30px;line-height:1.3}
#readerContent{white-space:pre-wrap;overflow-wrap:anywhere}
#admin{display:none;background:white;border:1px solid #e1e6df;border-radius:14px;padding:20px;margin:30px 0}
#admin form{display:grid;gap:12px;margin:18px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item{border-top:1px solid #e5e8df;padding:14px 0}
.muted{color:var(--muted);font-size:14px}
footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid #e5e8df}
@media(max-width:500px){header{padding:17px 5%}main{padding:22px 15px}.hero{padding-top:20px}}
</style>
</head>
<body>
<header>
  <div class="logo">DailyRead.</div>
  <button id="loginBtn" onclick="showLogin()">Admin Login</button>
</header>

<main>
  <section class="hero">
    <small>READ • LEARN • GROW</small>
    <h1>Stories worth<br>your time.</h1>
    <p>Discover fresh ideas, helpful guides and interesting stories, all in one place.</p>
  </section>

  <div class="tools">
    <input id="search" placeholder="Search articles..." oninput="renderArticles()">
    <button class="secondary" onclick="loadArticles()">Refresh</button>
  </div>

  <p id="status" class="muted">Loading articles...</p>
  <section id="articles" class="grid"></section>

  <section id="reader">
    <button class="secondary" onclick="closeArticle()">← Back to articles</button>
    <p id="readerCategory" class="tag"></p>
    <h2 id="readerTitle"></h2>
    <p class="muted" id="readerMeta"></p>
    <div id="readerContent"></div>
  </section>

  <section id="admin">
    <h2>DailyRead Admin</h2>
    <p class="muted" id="adminMessage">Manage your articles here.</p>
    <button class="secondary" onclick="logout()">Log out</button>

    <form id="articleForm">
      <h3 id="formHeading">Write a new article</h3>
      <input id="title" placeholder="Article title" required>
      <input id="category" placeholder="Category (e.g. Technology)" value="General">
      <input id="author" placeholder="Author name" value="DailyRead Team">
      <textarea id="excerpt" placeholder="Short article description" rows="3" required></textarea>
      <textarea id="content" placeholder="Full article content" rows="9" required></textarea>
      <label><input id="published" type="checkbox" checked style="width:auto"> Publish article publicly</label>
      <div class="row">
        <button type="submit">Save article</button>
        <button type="button" class="secondary" onclick="resetForm()">Clear form</button>
      </div>
    </form>
    <h3>Your articles</h3>
    <div id="manageList"></div>
  </section>
</main>

<footer>© <span id="year"></span> DailyRead. Read something meaningful every day.</footer>

<script>
const SUPABASE_URL = "https://hmnvqiqdntlhsxunzfjb.supabase.co";
const SUPABASE_KEY = "sb_publishable_NdcJYqV8jM0fe9LbjMP75w_JnxcZLAs";

let db = null;
let allArticles = [];
let editingId = null;

document.getElementById("year").textContent = new Date().getFullYear();

function showStatus(message) {
  document.getElementById("status").textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showLogin() {
  if (!db) return alert("Pehle Supabase URL aur Publishable key add karo.");
  const email = prompt("umairprince389@gmail.com:");
  if (!email) return;
  const password = prompt("Admin password:");
  if (!password) return;

  db.auth.signInWithPassword({email, password}).then(({error}) => {
    if (error) alert("Login error: " + error.message);
    else updateSession();
  });
}

async function updateSession() {
  if (!db) return;
  const {data:{session}} = await db.auth.getSession();
  const isLoggedIn = !!session;
  document.getElementById("admin").style.display = isLoggedIn ? "block" : "none";
  document.getElementById("loginBtn").textContent = isLoggedIn ? "Admin Panel" : "Admin Login";
  if (isLoggedIn) loadAdminArticles();
}

async function logout() {
  await db.auth.signOut();
  document.getElementById("admin").style.display = "none";
  document.getElementById("loginBtn").textContent = "Admin Login";
  resetForm();
}

async function loadArticles() {
  if (!db) {
    showStatus("Setup pending: Supabase URL aur Publishable key add karni hain.");
    return;
  }
  showStatus("Loading articles...");
  const {data,error} = await db.from("articles")
    .select("id,title,excerpt,content,category,author,published,created_at")
    .eq("published", true).order("created_at", {ascending:false});

  if (error) {
    showStatus("Articles load nahi huay: " + error.message);
    return;
  }
  allArticles = data || [];
  renderArticles();
}

function renderArticles() {
  const query = document.getElementById("search").value.toLowerCase();
  const filtered = allArticles.filter(a =>
    [a.title,a.excerpt,a.category,a.author].join(" ").toLowerCase().includes(query)
  );
  document.getElementById("articles").innerHTML = filtered.map(a => `
    <article class="article">
      <span class="tag">${escapeHTML(a.category)}</span>
      <h2>${escapeHTML(a.title)}</h2>
      <p>${escapeHTML(a.excerpt)}</p>
      <p class="muted">By ${escapeHTML(a.author)}</p>
      <button onclick="openArticle(${Number(a.id)})">Read article →</button>
    </article>
  `).join("");
  if (!filtered.length) showStatus(query ? "No matching articles found." : "Abhi koi published article nahi hai.");
  else showStatus(filtered.length + " article(s) available");
}

function openArticle(id) {
  const a = allArticles.find(x => Number(x.id) === Number(id));
  if (!a) return;
  document.getElementById("readerCategory").textContent = a.category || "General";
  document.getElementById("readerTitle").textContent = a.title;
  document.getElementById("readerMeta").textContent =
    "By " + a.author + " • " + new Date(a.created_at).toLocaleDateString();
  document.getElementById("readerContent").textContent = a.content;
  document.getElementById("reader").style.display = "block";
  document.getElementById("articles").style.display = "none";
  document.getElementById("reader").scrollIntoView({behavior:"smooth"});
}

function closeArticle() {
  document.getElementById("reader").style.display = "none";
  document.getElementById("articles").style.display = "grid";
}

async function loadAdminArticles() {
  const {data:{user}} = await db.auth.getUser();
  if (!user) return;
  document.getElementById("adminMessage").textContent = "Logged in as " + user.email;

  const {data,error} = await db.from("articles")
    .select("*").order("created_at",{ascending:false});

  if (error) {
    document.getElementById("manageList").textContent = "Error: " + error.message;
    return;
  }

  document.getElementById("manageList").innerHTML = (data || []).map(a => `
    <div class="item">
      <strong>${escapeHTML(a.title)}</strong>
      <p class="muted">${a.published ? "Published" : "Draft"}</p>
      <div class="row">
        <button class="secondary" onclick="editArticle(${Number(a.id)})">Edit</button>
        <button onclick="deleteArticle(${Number(a.id)})">Delete</button>
      </div>
    </div>
  `).join("") || "No articles yet.";

  await loadArticles();
}

function resetForm() {
  editingId = null;
  document.getElementById("articleForm").reset();
  document.getElementById("category").value = "General";
  document.getElementById("author").value = "DailyRead Team";
  document.getElementById("published").checked = true;
  document.getElementById("formHeading").textContent = "Write a new article";
}

async function editArticle(id) {
  const {data,error} = await db.from("articles").select("*").eq("id",id).single();
  if (error) return alert(error.message);
  editingId = id;
  document.getElementById("title").value = data.title || "";
  document.getElementById("category").value = data.category || "General";
  document.getElementById("author").value = data.author || "DailyRead Team";
  document.getElementById("excerpt").value = data.excerpt || "";
  document.getElementById("content").value = data.content || "";
  document.getElementById("published").checked = !!data.published;
  document.getElementById("formHeading").textContent = "Edit article";
  document.getElementById("articleForm").scrollIntoView({behavior:"smooth"});
}

async function deleteArticle(id) {
  if (!confirm("Kya waqai is article ko delete karna hai?")) return;
  const {error} = await db.from("articles").delete().eq("id",id);
  if (error) return alert("Delete error: " + error.message);
  await loadAdminArticles();
}

document.getElementById("articleForm").addEventListener("submit", async event => {
  event.preventDefault();
  const {data:{user}} = await db.auth.getUser();
  if (!user) return alert("Pehle admin login karo.");

  const article = {
    title: document.getElementById("title").value.trim(),
    category: document.getElementById("category").value.trim() || "General",
    author: document.getElementById("author").value.trim() || "DailyRead Team",
    excerpt: document.getElementById("excerpt").value.trim(),
    content: document.getElementById("content").value.trim(),
    published: document.getElementById("published").checked
  };

  const result = editingId
    ? await db.from("articles").update(article).eq("id",editingId)
    : await db.from("articles").insert(article);

  if (result.error) return alert("Save error: " + result.error.message);
  alert("Article save ho gaya!");
  resetForm();
  await loadAdminArticles();
});

if (
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("https://hmnvqiqdntlhsxunzfjb.supabase.co") &&
  SUPABASE_KEY &&
  !SUPABASE_KEY.includes("sb_publishable_NdcJYqV8jM0fe9LbjMP75w_JnxcZLAs")
) {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  db.auth.onAuthStateChange(() => {
    setTimeout(updateSession, 0);
  });
  loadArticles();
  updateSession();
} else {
  showStatus("Setup pending: Supabase credentials add karni hain.");
}
</script>
</body>
  </html>
